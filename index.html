    <script>
      // Filter out harmless [vite] failed to connect to websocket logs in AI Studio preview iframe
      (function() {
        var filterMsg = function(msg) {
          if (!msg) return false;
          var s = String(msg);
          return s.includes('failed to connect to websocket') || 
                 s.includes('WebSocket closed without opened') || 
                 s.includes('@vite/client') || 
                 s.includes('[vite]');
        };
        ['error', 'warn', 'log'].forEach(function(method) {
          var orig = console[method];
          if (typeof orig === 'function') {
            console[method] = function() {
              for (var i = 0; i < arguments.length; i++) {
                if (filterMsg(arguments[i])) return;
              }
              orig.apply(console, arguments);
            };
          }
        });
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = reason ? (reason.message || String(reason)) : '';
          if (filterMsg(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          var msg = event ? (event.message || String(event)) : '';
          if (filterMsg(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
